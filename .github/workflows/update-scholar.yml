# Nightly refresh of vebro.net/scholar/publications.json from ORCID + OpenAlex.
# Commits only when the data actually changed.
name: Update scholar publications

on:
  schedule:
    - cron: "17 13 * * *"   # 13:17 UTC = 3:17 AM Hawaii time
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-scholar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate publications.json
        run: python3 scholar/update.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- scholar/publications.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scholar/publications.json
          git commit -m "Update scholar publications (ORCID + OpenAlex)"
          git push
